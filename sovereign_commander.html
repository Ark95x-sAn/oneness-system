function renderAgents(){
  const domains = [...new Set(agentsCache.agents.map(a => a.domain))].sort();
  const domainEl = document.getElementById('agent-domains');
  domainEl.innerHTML = domains.map(d => `<button onclick="filterAgents('${d}')" style="background:#151a26;border:1px solid var(--border);color:var(--text);padding:4px 10px;border-radius:6px;font-size:.72rem;cursor:pointer;">${d}</button>`).join('') +
    ` <button onclick="filterAgents(null)" style="background:#151a26;border:1px solid var(--border);color:var(--text);padding:4px 10px;border-radius:6px;font-size:.72rem;cursor:pointer;">all</button>`;
  filterAgents(null);
}

function filterAgents(domain){
  const list = document.getElementById('agent-list');
  const filtered = domain ? agentsCache.agents.filter(a => a.domain === domain) : agentsCache.agents;
  let html = `<div style="color:var(--muted);margin-bottom:6px;">${filtered.length} agents${domain ? ' in ' + domain : ''}</div>`;
  html += '<div style="display:flex;flex-direction:column;gap:4px;">';
  for (const a of filtered.slice(0, 50)){
    html += `<div style="display:flex;justify-content:space-between;align-items:center;background:#0c0f17;border:1px solid var(--border);padding:6px 8px;border-radius:6px;">
      <span>${a.display}</span>
      <button onclick="intent('agent', '${a.id}')" style="background:#151a26;border:1px solid var(--border);color:var(--text);padding:2px 8px;border-radius:4px;font-size:.68rem;cursor:pointer;">preview</button>
    </div>`;
  }
  if (filtered.length > 50) html += `<div style="color:var(--muted);">... and ${filtered.length - 50} more</div>`;
  html += '</div>';
  list.innerHTML = html;
}

function renderMatrix(){
  const el = document.getElementById('matrix');
  el.innerHTML = '';
  apps.forEach(app => {
    const card = document.createElement('div');
    card.className = 'app-card';
    const runningCls = app.running ? 'on' : 'off';
    const detectedCls = app.detected ? 'on' : 'off';
    const slotLabel = app.slot_type === 'wired' ? 'Wired' : 'Bridgeable Slot';
    const launchBtn = app.can_launch ? `<button onclick="requestLaunch('${app.id}')">Prepare Launch</button>` : '';
    const bridgeBtn = app.slot_type === 'bridgeable' ? `<button onclick="intent('bridge','${app.id}')">Bridge Slot</button>` : '';
    card.innerHTML = `
      <div class="info">
        <h3>${app.display}</h3>
        <p>${app.connection_methods.join(' · ')}</p>
        <div class="status">
          <span class="${runningCls}">${app.running ? 'Running' : 'Stopped'}</span>
          <span class="${detectedCls}">${app.detected ? 'Detected' : 'Not Detected'}</span>
          <span class="slot">${slotLabel}</span>
        </div>
      </div>
      <div class="actions">${launchBtn}${bridgeBtn}</div>
    `;
    el.appendChild(card);
  });
}

function renderAgency(){
  const el = document.getElementById('agency');
  let html = '<div style="display:flex;flex-direction:column;gap:8px;">';
  for (const [key, bp] of Object.entries(blueprints)){
    html += `<button onclick="intent('pipeline','${key}')" style="background:#151a26;border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;text-align:left;cursor:pointer;font-size:.78rem;">${bp.display}</button>`;
  }
  html += '</div><div style="margin-top:12px;font-size:.75rem;color:var(--muted);">Recent runs:</div>';
  if (recentPipelines.length === 0){
    html += '<div style="font-size:.72rem;color:var(--muted);">No pipeline records yet.</div>';
  } else {
    html += '<ul style="padding-left:16px;margin:6px 0;font-size:.72rem;color:var(--muted);">';
    for (const p of recentPipelines.slice(0,8)){
      html += `<li><span style="color:var(--accent)">${p.id}</span> — ${p.status}</li>`;
    }
    html += '</ul>';
  }
  el.innerHTML = html;
}

function renderAssets(){
  const el = document.getElementById('assets');
  let html = '';
  for (const [k,v] of Object.entries(onenessAssets)){
    if (Array.isArray(v)) {
      html += `<strong style="color:#fff;display:block;margin-top:10px;">${k}</strong>` + v.map(x => `<div><a href="${x}" target="_blank">${x}</a></div>`).join('');
    } else {
      html += `<strong style="color:#fff;display:block;margin-top:10px;">${k}</strong><div><a href="${v}" target="_blank">${v}</a></div>`;
    }
  }
  el.innerHTML = html;
}

function log(action, target, note){
  const el = document.getElementById('log');
  const line = document.createElement('div');
  line.className = 'line';
  line.innerHTML = `<span class="ts">${new Date().toISOString().slice(0,19)}</span><span class="src">${action}</span>${target}${note ? ' — ' + note : ''}`;
  el.insertBefore(line, el.firstChild);
}

function intent(action, target){
  log(action, target, 'preview — no autopilot; confirm in chat to execute');
}

function requestLaunch(appId){
  const app = apps.find(a => a.id === appId);
  intent('launch', appId, `${app.launch_methods[0] || 'no launch method'} — click Start API Server to arm`);
}

function refreshMap(){
  log('refresh', 'system_map', 'run scan_sovereign.py or refresh this page after a new scan');
}

function openLocal(path){
  window.open(path, '_blank');
  log('open', path, 'opened in new tab');
}

function startApi(){
  log('api', 'start', 'run: python run_sovereign_api.py  (http://127.0.0.1:9500)');
}

renderMatrix();
renderAgency();
renderAgents();
renderAssets();
log('ready', 'sovereign_desktop', 'dashboard loaded — safe mode');
</script>
